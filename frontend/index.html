<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chitkara University FAQ Assistant</title>

    <meta
        name="description"
        content="Chitkara University AI-powered FAQ Assistant for admissions, fees, academics and university services."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- ================= HEADER ================= -->
        <header class="app-header">

            <div class="brand-section">

                <div class="university-logo">
                    <img src = "logo.jpg" alt="Chitkara University Logo" />
                </div>

                <div class="brand-text">
                    <h1>Chitkara University</h1>
                    <p>FAQ Assistant</p>
                </div>

            </div>

            <div class="header-right">

                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>AI Assistant Online</span>
                </div>

                <button
                    class="clear-header-btn"
                    id="clearChatHeader"
                    title="Clear conversation"
                    aria-label="Clear conversation"
                >
                    <span style="font-weight: bold;">↻</span>
                </button>

            </div>

        </header>


        <!-- ================= CHAT SECTION ================= -->
        <main class="chat-wrapper">

            <section
                class="chat-area"
                id="chatArea"
                aria-live="polite"
            >

                <!-- ================= WELCOME SCREEN ================= -->
                <div class="welcome-screen" id="welcomeScreen">

                    <div class="welcome-icon">
                        <div class="ai-face">
                            ✦
                        </div>
                    </div>

                    <p class="welcome-label">CHITKARA AI ASSISTANT</p>

                    <h2>Hello! How can I help you?</h2>

                    <p class="welcome-description">
                        Ask me about admissions, eligibility, fees, academics,
                        library rules and other university-related information.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion-btn">
                            <span>Q1</span>
                            What is the admission process?
                        </button>

                        <button class="suggestion-btn">
                            <span>Q2</span>
                            What are the eligibility requirements?
                        </button>

                        <button class="suggestion-btn">
                            <span>Q3</span>
                            What is the fee structure?
                        </button>

                        <button class="suggestion-btn">
                            <span>Q4</span>
                            What documents are required for admission?
                        </button>

                        <button class="suggestion-btn">
                            <span>Q5</span>
                            What are the library rules?
                        </button>

                    </div>

                </div>


                <!-- ================= MESSAGES ================= -->
                <div
                    class="messages-container"
                    id="messagesContainer"
                ></div>


                <!-- ================= TYPING INDICATOR ================= -->
                <div
                    class="typing-container hidden"
                    id="typingIndicator"
                >

                    <div class="message-avatar ai-avatar">
                        ✦
                    </div>

                    <div class="typing-bubble">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </section>


            <!-- ================= INPUT AREA ================= -->
            <section class="input-section">

                <div class="input-card">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Ask anything about Chitkara University..."
                        aria-label="Type your question"
                    ></textarea>


                    <div class="input-actions">

                        <div class="left-actions">

                            <!-- Future Azure Speech-to-Text button -->
                            <button
                                id="micButton"
                                class="icon-button"
                                title="Voice input"
                                aria-label="Voice input"
                            >
                                <svg
                                    width="19"
                                    height="19"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="22"></line>
                                    <line x1="8" y1="22" x2="16" y2="22"></line>
                                </svg>
                            </button>

                            <span class="voice-label">
                                Voice
                            </span>

                        </div>


                        <button
                            id="sendButton"
                            class="send-button"
                            title="Send message"
                            aria-label="Send message"
                        >
                            <span>Send</span>

                            <svg
                                width="17"
                                height="17"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>

                        </button>

                    </div>

                </div>


                <div class="bottom-info">

                    <button
                        id="clearChatButton"
                        class="clear-chat-btn"
                    >
                        Clear conversation
                    </button>

                    <p>
                        AI-generated responses may require verification.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- ================= JAVASCRIPT ================= -->
     <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
    <script src="app.js"></script>

</body>
</html>
